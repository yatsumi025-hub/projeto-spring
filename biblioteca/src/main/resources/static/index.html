<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Biblioteca</h1>

        <div id="livro">
            Carregando...
        </div>

        <div id="cadastro">
            <h2>Cadastrar livro</h2>
            <form id="form-livro">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" required>

                <label for="autor">Autor</label>
                <input type="text" id="autor" required>

                <label>
                    <input type="checkbox" id="disponivel" checked>
                    Disponível
                </label>

                <button type="submit">Cadastrar livro</button>
            </form>
            <p id="mensagem"></p>
        </div>

        <div id="lista">
            <h2>Livros cadastrados</h2>
            <ul id="lista-livros"></ul>
        </div>

    </div>

   <script>
    function carregarLivro() {
    fetch('/livro')
        .then(response => response.json())
        .then(livro => {
            document.getElementById('livro').innerHTML = `
                <h2>${livro.titulo}</h2>
                <p>Autor: ${livro.autor}</p>
                <p>Disponível: ${livro.disponivel ? 'Sim' : 'Não'}</p>

                ${
                    livro.disponivel
                    ? '<button class="disponivel" onclick="emprestarLivro()">Emprestar</button>'
                    : '<button class="indisponivel" onclick="devolverLivro()">Devolver</button>'
                }
            `;
        });
    }

    function emprestarLivro() {
        fetch('/livro/emprestar')
            .then(() => carregarLivro());
    }

    function devolverLivro() {
        fetch('/livro/devolver')
            .then(() => carregarLivro());
    }

    function carregarLivros() {
        fetch('/livros')
            .then(response => response.json())
            .then(livros => {
                document.getElementById('lista-livros').innerHTML = livros
                    .map(l => `<li>${l.titulo} — ${l.autor} (Disponível: ${l.disponivel ? 'Sim' : 'Não'})</li>`)
                    .join('');
            });
    }

    document.getElementById('form-livro').addEventListener('submit', event => {
        event.preventDefault();

        fetch('/livros', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                titulo: document.getElementById('titulo').value,
                autor: document.getElementById('autor').value,
                disponivel: document.getElementById('disponivel').checked
            })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error();
            }
            return response.json();
        })
        .then(livro => {
            document.getElementById('mensagem').textContent = 'Livro cadastrado com sucesso!';
            document.getElementById('form-livro').reset();
            carregarLivros();
        })
        .catch(() => {
            document.getElementById('mensagem').textContent = 'Erro ao cadastrar livro.';
        });
    });

    carregarLivro();
    carregarLivros();
</script>

</body>
</html>
